on:
  push:
    tags:
      - "v*"
name: Release Creation

permissions:
  contents: write

jobs:
  release:
    name: Create a Draft Release on GitHub
    runs-on: ubuntu-latest
    steps:
    - name: Get Release Name
      id: get_release_name
      run: |
        echo "release_name=${GITHUB_REF_NAME/v/Version }" >> $GITHUB_ENV
    - name: Publish a Draft Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        draft: true  # Creates a Draft Release
        name: ${{ env.release_name }}
        generate_release_notes: true
